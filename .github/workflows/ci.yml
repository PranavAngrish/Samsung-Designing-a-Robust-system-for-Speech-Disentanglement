name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check solospeak tests scripts
      - name: Type check
        run: mypy solospeak
      - name: Unit tests
        run: pytest -p no:capture tests/unit -v -m "not slow and not data and not tts and not demo" --cov=solospeak --cov-report=xml
      - name: Prepare smoke data
        run: |
          python -m scripts.download_datasets --minimal
          python -m scripts.prepare_manifests --smoke
      - name: Integration smoke tests
        run: pytest -p no:capture tests/integration -v -m "not slow and not data and not tts and not demo"
