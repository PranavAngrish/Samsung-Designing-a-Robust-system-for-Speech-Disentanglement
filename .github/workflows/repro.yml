name: Reproducibility Check
on:
  workflow_dispatch:   # manual trigger only — expensive

jobs:
  repro:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Numeric reference tests
        run: pytest tests/regression -v --tb=long
