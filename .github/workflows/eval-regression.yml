name: Eval Regression
on:
  schedule:
    - cron: "0 2 * * *"   # nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Checkpoint path relative to repo root"
        required: false
        default: "checkpoints/latest.pt"

jobs:
  eval:
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run eval smoke (no real data in CI)
        run: pytest tests/regression -v -m "not slow"
