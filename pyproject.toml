[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solospeak"
version = "0.1.0"
description = "Speaker-personalized custom wake-word detection"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Pranav Angrish", email = "pangrish_be22@thapar.edu"}]

dependencies = [
    "torch>=2.3.1",
    "torchaudio>=2.3.1",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "lmdb>=1.5.1",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxscript>=0.1.0",
    "onnxsim>=0.4.36",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.1",
    "tqdm>=4.66.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "wandb>=0.17.0",
    "g2p-en>=2.1.0",
    "speechbrain>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
    "pytest-xdist==3.6.1",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "pdoc==14.5.1",
    "kaggle==1.6.14",
]
tts = [
    "transformers==4.41.0",
    "parler-tts==0.2.3",
]
demo = [
    "sounddevice==0.4.6",
]

[project.scripts]
solospeak-train = "scripts.run_stage:main"
solospeak-production = "scripts.run_production_pipeline:main"
solospeak-eval = "scripts.run_eval:main"
solospeak-export = "scripts.export_and_validate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["solospeak*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:capture"]
markers = [
    "slow: marks tests requiring real data or long runtime",
    "gpu: marks tests requiring CUDA",
    "onnx: marks tests for ONNX export/runtime",
    "data: marks tests requiring downloaded or LMDB-packed datasets",
    "tts: marks optional tests requiring the .[tts] extra",
    "demo: marks optional tests requiring microphone/demo dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
