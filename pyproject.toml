[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solospeak"
version = "0.1.0"
description = "Speaker-personalized custom wake-word detection"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
authors = [{name = "Pranav Angrish", email = "pranavangrishmusic@gmail.com"}]

dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "wandb>=0.17.0",
    "g2p-en>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
tts = [
    "transformers>=4.41.0",
    "parler-tts>=0.2.1",
]

[project.scripts]
solospeak-train = "scripts.run_stage:main"
solospeak-eval = "scripts.run_eval:main"
solospeak-export = "scripts.export_and_validate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["solospeak*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests requiring real data or long runtime",
    "gpu: marks tests requiring CUDA",
    "onnx: marks tests for ONNX export/runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# numpy ndarray generics require numpy.typing.NDArray — not enforced in stubs
disallow_any_generics = false
