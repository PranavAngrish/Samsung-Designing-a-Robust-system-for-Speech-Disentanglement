run_name: solospeak-default

training:
  stage: 1
  checkpoint_every_steps: 500
  upload_every_steps: 2000

audio:
  sample_rate: 16000
  n_fft: 400
  hop_length: 160
  win_length: 400
  n_mels: 80
  fmin: 20.0
  fmax: 7600.0
  window_duration_s: 1.6
  window_samples: 25600
  window_frames: 160

backbone:
  variant: bcresnet8

heads:
  content_dim: 128
  speaker_dim: 128
  hidden_dim: 256
  dropout: 0.1

fusion:
  hidden_dims: [20, 10]
  tau_on: 0.65
  tau_off: 0.45

losses:
  supcon_content: 1.0
  supcon_speaker: 1.0
  orthogonality: 0.1
  adversarial: 0.1
  ce_aux: 0.5
  adversarial_ramp_steps: 5000

data:
  root: data/processed
  manifests_dir: data/manifests
  snr_range_db: [-5, 30]
  distance_range_m: [0.5, 5.0]
  augmentation_prob: 0.8
  hard_neg_fraction: 0.3
