run_name: solospeak-stage3-disentangle

training:
  stage: 3
  batch_size: 128
  num_epochs: 10
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 200
  max_grad_norm: 5.0
  precision: amp_bf16
  seed: 42
  num_workers: 4
  resume_from: checkpoints/stage2_dualhead.pt
  checkpoint_dir: checkpoints

losses:
  supcon_content: 1.0
  supcon_speaker: 1.0
  orthogonality: 0.1
  adversarial: 0.1
  adversarial_ramp_steps: 5000
  ce_aux: 0.5

# GO/NO-GO gate: probe classifier accuracy on z_c predicting speaker-ID <= 20%
# Expected: speaker-from-content probe drops from ~60% -> ~15%
