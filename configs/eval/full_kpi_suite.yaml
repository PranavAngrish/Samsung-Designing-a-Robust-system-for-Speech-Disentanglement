test_manifests:
  - data/manifests/test_kpi.csv
  - data/manifests/test_fa.csv
noise_snrs_db: [-5, 0, 5, 10, 15, 20, 25, 30]
distance_buckets_m: [0.5, 1.0, 2.0, 3.5, 5.0]
fa_audio_hours: 10.0
fa_n_user_buckets: [1, 4, 8]
n_seeds: 3
subgroups_optional: [gender, age, accent]
subgroups_mandatory: [keyword_syllable_count]
q3_neighbors_per_keyword: 5
q3_max_edit_distance: 2
q3_synthesis_fallback: true

validation_gates:
  max_filesize_mb: 5.0
  min_opset: 17
  max_xrt: 0.20
  min_ta_clean: 0.92
  min_ta_noisy_macro: 0.80
  max_fa_per_hr_per_user: 2.0
  max_param_count: 3000000
  max_int8_vs_fp32_degradation_pp: 1.0
